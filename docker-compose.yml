services:
  postgres-db:
    image: postgres:16-alpine
    container_name: dexsabase
    restart: always
    environment:
      POSTGRES_USER: dexamenus
      POSTGRES_PASSWORD: supahsecretNumberOne
      POSTGRES_DB: dexbase
    ports:
    #Format: "host_port:container_port"
      - "5432:5432"
    volumes:
    #menyimpan data di volume agar tidak hilang saat container dihapus
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
